# Reference manifest for optional DINOv2 tooling in the shared pt210 runtime.
# Create pt210 with ../../envs/torch210-cu128/create_env.sh first; install the
# maintained project requirements afterwards with --no-deps.
name: pt210
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch=2.10.*
  - torchvision=0.25.*
  - torchaudio=2.10.*
  - pytorch-cuda=12.8
  - omegaconf
  - torchmetrics
  - fvcore
  - iopath
  - pip:
    - submitit
# Optional OpenMMLab/RAPIDS dependencies are pinned by the workspace installer;
# do not install old mmcv-full or cu11 packages into pt210.
