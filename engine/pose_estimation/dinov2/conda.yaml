# Reference manifest for the vendored DINOv2 component.
# The authoritative workspace creator is ../../envs/torch210-cu128/create_env.sh;
# this file must not be used to replace the shared pt210 Torch/CUDA stack.
name: pt210
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch=2.10.*
  - torchvision=0.25.*
  - torchaudio=2.10.*
  - pytorch-cuda=12.8
  - omegaconf
  - torchmetrics
  - fvcore
  - iopath
  - pip:
    - submitit
# xFormers 0.0.35 and any optional RAPIDS packages are installed by the
# maintained pt210 workflow so their CUDA/PyTorch ABI remains consistent.
